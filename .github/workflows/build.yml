name: build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
  # 供 release.yml 在推 tag 时复用这两个平台的构建（同一 run，产物可直接下载）
  workflow_call:

# 自测是硬性要求：两个平台都必须把「单元测试 + 黄金向量 + 前端一致性 + HTTP 端到端」
# 全部跑绿，构建才算通过。任何一层失败都会让 job 红掉，从而挡住 release。
jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows x64 Release
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 环境信息
        run: |
          cmake --version
          git --version
          python --version
        shell: pwsh

      # 预设里刻意不写死 Visual Studio 版本，跟随 runner 上默认（最新）的 VS：
      # windows-latest 现在已经只有 VS2026，写死 "Visual Studio 17 2022" 会直接报
      # 「could not find any instance of Visual Studio」。
      - name: 配置（会自动拉取 cpp-httplib / webview / cpp-embedlib / nlohmann-json / tinyexpr++ / WebView2 SDK）
        run: cmake --preset x64

      - name: 编译 Release
        run: cmake --build --preset release

      # 1) CTest：单元测试（44 个用例）+ 黄金向量（334 条），两个测试都要求打印
      #    ALL TESTS PASSED 才算过（PASS_REGULAR_EXPRESSION 写在 CMakeLists 里）。
      - name: 自测 ① 单元测试 + 黄金向量（ctest）
        run: ctest --preset windows-release --output-on-failure

      # CTest 只在失败时吐输出，于是 README 里那几个「多少用例 / 多少断言」的数字
      # 没法从 CI 日志复核（本机跑出来的数字读者无从验证）。这一步把两个测试程序的
      # 汇总行直接打进日志：不额外构建、不做新检查，几毫秒，只为可复核。
      - name: 自测 ① 明细（汇总行打进日志，供 README 复核）
        run: |
          build/Release/crosscalc_tests.exe | Select-Object -Last 6
          build/Release/crosscalc_tests.exe --vectors tests/vectors/standard.json tests/vectors/scientific.json tests/vectors/programmer.json tests/vectors/errors.json | Select-Object -Last 6
        shell: pwsh

      # 2) 端到端：把真实 exe 用 --headless 起起来，把全部黄金向量再经 HTTP 回放一遍。
      #    这一层能抓到编译进去的资源和 API 序列化才出问题的那类 bug。
      - name: 自测 ② HTTP 端到端（真实进程）
        run: python tests/e2e_api.py --binary build/Release/crosscalc.exe
        shell: pwsh

      # 3) 前端静态一致性：键盘按钮只能插入引擎真正认识的函数，DOM id / 模式集合 /
      #    /api/* 契约都要对得上。不启动浏览器也能守住最常见的"改前端忘了改后端"。
      - name: 自测 ③ 前端 ↔ 引擎一致性
        run: python tests/check_frontend.py --tests-binary build/Release/crosscalc_tests.exe
        shell: pwsh

      # 4) app.js 里纯函数用 Node 真跑一遍。重点是二进制/八进制数字键 → 0x 字面量
      #    的重排：算错了界面不会报错，只会静默显示成另一个数，必须靠对照验证。
      - name: 自测 ④ app.js 纯函数（Node）
        run: node tests/js_frontend_test.js
        shell: pwsh

      - name: 检查产物
        run: |
          if (-not (Test-Path build/Release/crosscalc.exe)) { throw "产物缺失" }
          $len = (Get-Item build/Release/crosscalc.exe).Length
          Get-Item build/Release/crosscalc.exe | Format-List Name, Length
          # 顺手发一条 annotation：日志本身要 token 才能读，annotation 不用，
          # 这样 README 里的体积数字随时可以从 API 复核。
          Write-Host "::notice title=Windows 产物大小::$len 字节"
        shell: pwsh

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: crosscalc-win-x64
          path: build/Release/crosscalc.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux --
  linux:
    name: Ubuntu 22.04 / GCC / Ninja Release
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # Linux 上 webview 会在 configure 阶段就要求 pkg-config + GTK + WebKitGTK；
      # xvfb 是为了最后能无头启动 GUI 做冒烟测试。
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config ninja-build xvfb python3

      # Ubuntu 22.04 的 apt nodejs 是 12，够用（app.js 刻意避开了 ES2020+ 语法，
      # 原因之一就是它要能被 Node 加载做单元测试）。这里确认一下版本，便于排查。
      - name: 环境信息
        run: |
          cmake --version
          g++ --version
          python3 --version
          node --version
          pkg-config --modversion webkit2gtk-4.1 gtk+-3.0

      - name: 配置（会自动拉取 cpp-httplib / webview / cpp-embedlib / nlohmann-json / tinyexpr++）
        run: cmake --preset linux

      - name: 编译 Release
        run: cmake --build --preset linux-release

      - name: 自测 ① 单元测试 + 黄金向量（ctest）
        run: ctest --preset linux-release --output-on-failure

      # 同 Windows：把汇总行（用例数 / 断言数 / 跳过数）打进日志，供 README 复核。
      - name: 自测 ① 明细（汇总行打进日志，供 README 复核）
        run: |
          build-linux/crosscalc_tests | tail -n 6
          build-linux/crosscalc_tests --vectors tests/vectors/standard.json tests/vectors/scientific.json tests/vectors/programmer.json tests/vectors/errors.json | tail -n 6

      - name: 自测 ② HTTP 端到端（真实进程，无头）
        run: python3 tests/e2e_api.py --binary build-linux/crosscalc

      - name: 自测 ③ 前端 ↔ 引擎一致性
        run: python3 tests/check_frontend.py --tests-binary build-linux/crosscalc_tests

      - name: 自测 ④ app.js 纯函数（Node）
        run: node tests/js_frontend_test.js

      - name: 检查产物
        run: |
          test -x build-linux/crosscalc
          ls -l build-linux/crosscalc
          file build-linux/crosscalc
          # annotation 可以不带 token 读（日志不行），README 的体积数字靠它复核
          echo "::notice title=Linux 产物大小::$(stat -c%s build-linux/crosscalc) 字节"
          ldd build-linux/crosscalc | grep -i webkit

      # 上面三步都是无头验证，碰不到 GTK / WebKitGTK。这一步真的把 GUI 开起来
      # （Xvfb 提供显示），验证渲染链路是通的、接口返回的是合法 JSON、
      # 且内嵌的前端资源是"这一版"的。逻辑都在脚本里，本地也能直接跑：
      #   bash tests/smoke_gui.sh build-linux/crosscalc
      - name: 冒烟测试（Xvfb 无头运行 GUI）
        run: bash tests/smoke_gui.sh build-linux/crosscalc

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: crosscalc-linux-x64
          path: build-linux/crosscalc
          if-no-files-found: error

# 说明：
# - 自测分三层，任何一层失败都会让 job 红掉：
#   ① ctest —— 纯计算逻辑，不依赖网络和图形界面，跑得最快；
#   ② e2e_api.py —— 启动真实进程，验证「编译进去的东西」是对的；
#   ③ check_frontend.py —— 静态检查前端与引擎的契约，不用浏览器。
# - Windows job 不启动 GUI：没有交互式桌面会话时 webview 可能创建窗口失败，
#   而失败时会弹模态提示框把任务挂住。好在 e2e 用的是 --headless，不需要桌面。
# - Linux job 因为有 Xvfb，最后可以真的把窗口跑起来：断言「程序日志里出现窗口
#   自己发起的 GET /app.js」，就等于验证了 GTK + WebKitGTK 渲染链路是通的。
